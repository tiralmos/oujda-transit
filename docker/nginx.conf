# Address search (/api/geocode): one request per second to the upstream
# geocoder for the whole site, as Nominatim's usage policy asks, and results
# cached for a week. The location itself is generated at start-up by
# 40-oujda-config.sh into /etc/nginx/oujda/geocoder.conf.
limit_req_zone $server_name zone=geocode_rate:1m rate=1r/s;
proxy_cache_path /var/cache/nginx/geocode levels=1:2 keys_zone=geocode_cache:2m max_size=50m inactive=7d use_temp_path=off;
map $arg_lang $geocode_lang {
    default fr;
    en en;
    ar ar;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    charset utf-8;
    charset_types text/css text/csv application/javascript application/json application/geo+json application/manifest+json;

    gzip on;
    gzip_types text/css text/csv application/javascript application/json application/geo+json application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    # Files are not fingerprinted, so browsers revalidate (cheap 304s via ETag).
    add_header Cache-Control "no-cache" always;
    # Map tiles come from the configured tile server; everything else is local.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    # Sends the site's origin to the tile server, which the OSM tile policy asks for.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    include /etc/nginx/oujda/*.conf;

    location ~ \.csv$ {
        types { }
        default_type text/csv;
    }

    location ~ \.geojson$ {
        types { }
        default_type application/geo+json;
    }

    location ~ \.webmanifest$ {
        types { }
        default_type application/manifest+json;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
