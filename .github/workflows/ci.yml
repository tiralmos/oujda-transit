name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit tests
        run: npm test
      - name: Build image
        run: docker build -t oujda-transit:ci .
      - name: Start container
        run: |
          docker run -d --name app -p 8080:80 oujda-transit:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
      - name: End-to-end test
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          BASE_URL=http://localhost:8080 node tests/e2e/smoke.mjs
      - name: Container logs
        if: failure()
        run: docker logs app
