name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Startup script must use LF line endings
        run: "! grep -q $'\\r' docker-entrypoint.sh"
      - name: Build and smoke-test the Docker image
        run: |
          docker build -t oujda-transit .
          docker run -d --name ot -p 3002:3002 oujda-transit
          for i in $(seq 1 20); do curl -fsS http://localhost:3002/healthz && exit 0; sleep 1; done
          docker logs ot; exit 1
